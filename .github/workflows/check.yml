name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npx --yes @vscode/vsce@4.0.0 package
      - uses: actions/upload-artifact@v4
        with:
          name: preview-vsix
          path: "*.vsix"
