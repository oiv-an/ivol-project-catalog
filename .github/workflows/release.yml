name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release tag
        env:
          REF: ${{ github.ref }}
        run: |
          node -e 'const v=require("./package.json").version; if(process.env.REF!=="refs/tags/v"+v) throw Error("Run on the tag matching package.json")'
      - run: npm run check
      - run: npx --yes @vscode/vsce@4.0.0 package
      - name: Checksum
        run: shasum -a 256 *.vsix > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Каталог проектов ${tag}" --notes-file CHANGELOG.md
          fi
          gh release upload "$tag" *.vsix SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: "*.vsix"
  # Marketplace и Open VSX публикуются локально, только по запросу пользователя.
  # Не дублируем загрузку в магазины и не требуем их токены в GitHub Secrets.
